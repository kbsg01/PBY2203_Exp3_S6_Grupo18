server:
  port: 8081
  ssl:
    enabled: true
    key-store: classpath:bff-web-keystore.p12
    key-store-type: PKCS12
    # Solo un valor de demostracion academica; en produccion viviria en un gestor de secretos.
    key-store-password: "keystore-canal-web-banco-xyz-no-usar-en-produccion-2026"
    key-alias: bffweb

spring:
  application:
    name: bff-web
  config:
    # core-service.* y seguridad.jwt.secreto ahora viven en config-server (config-repo/bff-web.yml).
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # En Docker el hostname del contenedor no siempre es resoluble por los demas; registrar la IP
    # evita ese problema (docker-compose.yaml define EUREKA_PREFER_IP=true).
    prefer-ip-address: ${EUREKA_PREFER_IP:false}

# Actuator en un puerto de GESTION separado, solo HTTP y no publicado fuera de la red de Docker
# (ver docker-compose.yaml): /actuator/health para el HEALTHCHECK, y /actuator/circuitbreakers y
# /actuator/retries para observar el estado de Resilience4j en la evidencia de tolerancia a
# fallos, sin exponer nada de esto por el puerto HTTPS publico del canal.
management:
  server:
    port: 18081
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,retries

resilience4j:
  # Orden de los aspectos: CircuitBreaker( Retry( llamada ) ). Por defecto Resilience4j aplica
  # Retry por FUERA del circuit breaker; aqui se invierte (menor valor = aspecto mas externo) para
  # que el circuito cuente UNA falla por cada peticion de negocio, despues de agotar los
  # reintentos, y no una por cada reintento.
  retry:
    retry-aspect-order: 2
    instances:
      # Solo para lecturas (GET, idempotentes). El debito de bff-atm NO se reintenta nunca.
      coreServiceLectura:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Solo fallas transitorias de red/servidor; un 404 de negocio no se reintenta.
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      coreService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        ignore-exceptions:
          - com.bancoxyz.bff.web.exception.CuentaNoEncontradaException
      # Instancia SEPARADA de la anterior a proposito: una falla publicando en Kafka (broker
      # caido) no tiene relacion con que core-service este arriba o no, y no deberian compartir
      # el mismo contador de fallas ni el mismo circuito.
      kafkaProducer:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{45} - %msg%n"
  level:
    root: INFO
    com.bancoxyz.bff.web: INFO
