# server.port se sobreescribe con la variable de entorno SERVER_PORT para poder levantar 2
# instancias en la misma maquina (:8084 y :8085) que comparten el mismo consumer group de Kafka
# y demuestran asi el reparto de particiones (ver README, seccion de escalabilidad).
server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: notificaciones-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Mismo group-id en ambas instancias: es justamente eso lo que hace que Kafka reparta las
      # particiones del topico entre ellas en vez de que cada una reciba todos los mensajes.
      group-id: notificaciones-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.bancoxyz.bff.notificaciones.dto"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # Sin esto, 2 instancias podrian pisarse el instance-id en Eureka. Se incluye el host (distinto
    # en cada replica de docker-compose, que comparten el mismo puerto interno) y el puerto
    # (distinto cuando ambas corren en la misma maquina con "java -jar": :8084 y :8085).
    instance-id: ${spring.cloud.client.hostname}:${spring.application.name}:${server.port}
    prefer-ip-address: ${EUREKA_PREFER_IP:false}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{45} - %msg%n"
  level:
    root: INFO
    com.bancoxyz.bff.notificaciones: INFO
