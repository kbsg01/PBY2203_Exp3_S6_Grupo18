server:
  port: 8080

spring:
  application:
    name: core-service
  config:
    # La clave interna (core.internal-api-key) ahora vive en config-server (config-repo/core-service.yml).
    import: "optional:configserver:http://localhost:8888"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{45} - %msg%n"
  level:
    root: INFO
    com.bancoxyz.bff.core: INFO
