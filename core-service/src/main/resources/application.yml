server:
  port: 8080

spring:
  application:
    name: core-service
  config:
    # La clave interna (core.internal-api-key) ahora vive en config-server (config-repo/core-service.yml).
    import: "optional:configserver:http://localhost:8888"
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: core-service
      auto-offset-reset: earliest
    producer:
      # Espera confirmacion de TODAS las replicas antes de dar el envio por exitoso. Con un
      # broker de un solo nodo (ver docker-compose.yml) esto no cambia el comportamiento
      # practico, pero documenta la configuracion correcta para un cluster real de mas de un
      # broker (donde si marcaria la diferencia entre "aceptado" y "durable").
      acks: all

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{45} - %msg%n"
  level:
    root: INFO
    com.bancoxyz.bff.core: INFO
