# Orquestacion completa del ecosistema Banco XYZ (Semana 8): los 8 microservicios Spring Boot +
# el broker Kafka, en una sola configuracion lista para levantarse en un host con Docker (local o
# una VM/servicio de contenedores en la nube). Ver README.md, seccion 13.
#
# Uso (desde la raiz del repositorio):
#   mvn -DskipTests package              # 1) compila los 8 jars (las imagenes se construyen desde ellos)
#   docker compose up -d --build --wait  # 2) construye las 8 imagenes y levanta todo en orden
#   docker compose ps                    # estado y salud de cada contenedor
#   docker compose down                  # detiene y elimina contenedores y red
# o, en un solo paso: bash scripts/generar_evidencia_docker.sh
#
# Orden de arranque (depends_on + condition: service_healthy, usando el HEALTHCHECK de cada
# Dockerfile): kafka -> config-server -> eureka-server -> auth-server -> core-service -> BFF +
# notificaciones. Ningun servicio arranca antes de que sus dependencias esten realmente sanas.
#
# Exposicion de puertos (minima necesaria):
#   - Publicos (0.0.0.0): solo los 3 BFF (HTTPS 8081-8083), que son la unica puerta de entrada
#     de los clientes (web, movil, cajero).
#   - Solo 127.0.0.1 (para administracion/pruebas desde la misma maquina): config-server,
#     eureka-server (dashboard), auth-server, core-service y kafka. En un despliegue cloud real
#     estos ni siquiera se publicarian: vivirian en una subred privada.
#   - Sin publicar: puertos de gestion de los BFF (18081-18083) y notificaciones-service.
#
# Secretos: los valores por defecto de las variables *_CLIENT_SECRET son solo de demostracion
# academica. Pueden sobreescribirse con un archivo .env (no versionado) o variables de entorno
# del host; en produccion vendrian de un gestor de secretos (ej. AWS Secrets Manager).

name: bancoxyz

# ---------------------------------------------------------------------------------------------
# Bloques reutilizables (anclas YAML) para no repetir la misma configuracion en cada servicio.
# ---------------------------------------------------------------------------------------------
x-servicio-spring: &servicio-spring
  restart: unless-stopped            # reinicio automatico si el proceso cae (resiliencia)
  networks: [bancoxyz-net]
  deploy:
    resources:
      limits:
        memory: 512M                  # la JVM se ajusta a este limite (MaxRAMPercentage en Dockerfile)
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-entorno-cloud: &entorno-cloud
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://eureka-server:8761/eureka/
  EUREKA_PREFER_IP: "true"
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  AUTH_SERVER_URL: http://auth-server:9000
  AUTH_ISSUER: http://auth-server:9000
  TZ: America/Santiago

services:
  # -------------------------------------------------------------------------------------------
  # Infraestructura
  # -------------------------------------------------------------------------------------------
  kafka:
    # Apache Kafka oficial en modo KRaft (sin Zookeeper), broker+controller de un solo nodo.
    image: apache/kafka:3.7.0
    container_name: bancoxyz-kafka
    restart: unless-stopped
    networks: [bancoxyz-net]
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dos listeners de clientes:
      #   PLAINTEXT (:9092, anunciado como localhost:9092): para procesos que corren en el HOST
      #     con "java -jar" (scripts/generar_evidencia.sh, modo de las semanas 6-7).
      #   DOCKER (:29092, anunciado como kafka:29092): para los contenedores de esta red.
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 4 particiones por defecto: permite repartir bancoxyz.transferencias.resultado entre las
      # replicas de notificaciones-service (ver README, seccion 12.5).
      KAFKA_NUM_PARTITIONS: "4"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  config-server:
    <<: *servicio-spring
    build: ./config-server
    image: bancoxyz/config-server:1.0.0
    container_name: bancoxyz-config-server
    environment:
      TZ: America/Santiago
    ports:
      - "127.0.0.1:8888:8888"

  eureka-server:
    <<: *servicio-spring
    build: ./eureka-server
    image: bancoxyz/eureka-server:1.0.0
    container_name: bancoxyz-eureka-server
    environment:
      TZ: America/Santiago
    ports:
      - "127.0.0.1:8761:8761"

  auth-server:
    <<: *servicio-spring
    build: ./auth-server
    image: bancoxyz/auth-server:1.0.0
    container_name: bancoxyz-auth-server
    environment:
      AUTH_ISSUER: http://auth-server:9000
      TZ: America/Santiago
    ports:
      - "127.0.0.1:9000:9000"

  # -------------------------------------------------------------------------------------------
  # Negocio
  # -------------------------------------------------------------------------------------------
  core-service:
    <<: *servicio-spring
    build: ./core-service
    image: bancoxyz/core-service:1.0.0
    container_name: bancoxyz-core-service
    environment:
      <<: *entorno-cloud
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka: { condition: service_healthy }
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      auth-server: { condition: service_healthy }

  bff-web:
    <<: *servicio-spring
    build: ./bff-web
    image: bancoxyz/bff-web:1.0.0
    container_name: bancoxyz-bff-web
    environment:
      <<: *entorno-cloud
      BFF_WEB_CLIENT_SECRET: ${BFF_WEB_CLIENT_SECRET:-secreto-bff-web-banco-xyz-2026}
    ports:
      - "8081:8081"
    depends_on:
      core-service: { condition: service_healthy }

  bff-mobile:
    <<: *servicio-spring
    build: ./bff-mobile
    image: bancoxyz/bff-mobile:1.0.0
    container_name: bancoxyz-bff-mobile
    environment:
      <<: *entorno-cloud
      BFF_MOBILE_CLIENT_SECRET: ${BFF_MOBILE_CLIENT_SECRET:-secreto-bff-mobile-banco-xyz-2026}
    ports:
      - "8082:8082"
    depends_on:
      core-service: { condition: service_healthy }

  bff-atm:
    <<: *servicio-spring
    build: ./bff-atm
    image: bancoxyz/bff-atm:1.0.0
    container_name: bancoxyz-bff-atm
    environment:
      <<: *entorno-cloud
      BFF_ATM_CLIENT_SECRET: ${BFF_ATM_CLIENT_SECRET:-secreto-bff-atm-banco-xyz-2026}
    ports:
      - "8083:8083"
    depends_on:
      core-service: { condition: service_healthy }

  notificaciones-service:
    <<: *servicio-spring
    build: ./notificaciones-service
    image: bancoxyz/notificaciones-service:1.0.0
    # Sin container_name ni puertos publicados: asi Docker Compose puede crear N replicas
    # (escalado horizontal) que comparten el mismo consumer group de Kafka y se reparten las
    # particiones. Cambiar a mano con: docker compose up -d --scale notificaciones-service=3
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
    environment:
      <<: *entorno-cloud
    depends_on:
      kafka: { condition: service_healthy }
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }

networks:
  bancoxyz-net:
    name: bancoxyz-net
    driver: bridge
