name: Evidencia de ejecución BFF (Banco XYZ)

# Compila los 6 módulos (config-server, eureka-server, core-service, bff-web, bff-mobile,
# bff-atm) y delega en scripts/generar_evidencia.sh el resto: levantar los 6 servicios reales
# en orden, ejecutar las pruebas end-to-end y la prueba de tolerancia a fallos, y guardar todo
# en evidencias/. Es el MISMO script que se puede correr en local (Windows con Git Bash, Linux
# o macOS) para regenerar la evidencia sin depender de este workflow — ver la sección 11.6 del
# README. Publica los logs como evidencia de ejecución real, tal como exige la pauta de
# evaluación formativa de la Semana 6 (Config Server, Service Discovery, Circuit Breaker +
# autenticación).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  evidencia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Instalar jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Generar evidencia (build + levantar servicios + pruebas)
        run: bash scripts/generar_evidencia.sh

      - name: Publicar evidencia como artefacto descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-ejecucion-bff
          path: evidencias/*.log
          retention-days: 90
