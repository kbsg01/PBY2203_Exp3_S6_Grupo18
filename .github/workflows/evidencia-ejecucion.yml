name: Evidencia de ejecución BFF (Banco XYZ)

# Dos jobs independientes, ambos con evidencia real descargable desde la pestaña Actions:
#
# 1. "evidencia" (modo java -jar, semanas 6-8): compila los 8 módulos y delega en
#    scripts/generar_evidencia.sh: levanta Kafka con "docker compose up -d kafka", los 9 procesos
#    Java en orden (config-server, eureka-server, auth-server, core-service, 3 BFF y 2 instancias
#    de notificaciones-service) y corre las pruebas OAuth 2.0, end-to-end, de transferencias
#    (Saga + Kafka) y de tolerancia a fallos.
#
# 2. "evidencia-docker" (Semana 8): el ecosistema COMPLETO en contenedores, orquestado por
#    docker-compose.yaml, via scripts/generar_evidencia_docker.sh (construye las 8 imágenes,
#    "docker compose up --wait", mismas pruebas + recuperación automática y restart policy).
#
# Ambos scripts son los mismos que se pueden correr en local (Windows con Git Bash, Linux o
# macOS) para regenerar la evidencia sin depender de este workflow (README, secciones 11.6 y 13).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  evidencia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Instalar jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Generar evidencia (build + levantar servicios + pruebas)
        run: bash scripts/generar_evidencia.sh

      - name: Publicar evidencia como artefacto descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-ejecucion-bff
          path: evidencias/*.log
          retention-days: 90

  evidencia-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Instalar jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Generar evidencia Docker (8 imágenes + docker compose + pruebas)
        run: bash scripts/generar_evidencia_docker.sh

      - name: Publicar evidencia Docker como artefacto descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-ejecucion-docker
          path: evidencias/docker/*.log
          retention-days: 90
