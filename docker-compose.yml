# Infraestructura de mensajeria asincrona para la actividad de la Semana 7 (Config Server,
# Eureka y los 6 microservicios Java se siguen levantando con "java -jar", como en la Semana 6;
# este compose SOLO levanta el broker Kafka que esos servicios consumen).
#
# Se usa la imagen oficial de Apache Kafka (KRaft, sin Zookeeper) en modo combinado
# broker+controller de un solo nodo: la opcion mas simple posible para un entorno de desarrollo
# academico, sin sacrificar que sea Kafka real (no un mock ni un broker embebido de test).
#
# Uso:
#   docker compose up -d kafka      # levanta el broker en localhost:9092
#   docker compose down             # lo detiene y limpia el contenedor
#
# Requiere Docker Desktop (Windows/macOS) o Docker Engine (Linux) instalado y corriendo.
services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: bancoxyz-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # "localhost" porque los 6 microservicios corren fuera de Docker (java -jar) y se conectan
      # al puerto publicado en el host, exactamente igual que ya hacen con Eureka/Config Server.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 4 particiones por defecto: permite que bancoxyz.transferencias.resultado reparta trabajo
      # entre las 2 instancias de notificaciones-service (ver README, seccion de escalabilidad).
      KAFKA_NUM_PARTITIONS: "4"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
